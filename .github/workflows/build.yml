name: Build and Release

on:
  push:
    branches: [ "arena/**", main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Show build output
        if: always()
        run: ls -l build/libs || true

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: randommobs-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Random Mobs ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Random Mobs** — хоррор-мод для Minecraft 1.20.1 (Forge 47.x).

            ### Установка
            1. Установите Forge 1.20.1 (47.2.0+).
            2. Скопируйте `randommobs-1.0.0.jar` в папку `mods`.
            3. Запустите игру.

            Внутри: 13 мобов, 6 блоков, 19 предметов, эффект «заражение корней»,
            3 биома, 3 измерения, 4 структуры и 14 достижений.
          files: build/libs/*.jar
